<!doctype html>
<!-- Source for website/assets/og.png (1200×630 link-preview card).
     Rendered by scripts/make_og.sh; colours match website/style.css. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Relaunch preview card</title>
<style>
  :root {
    --bg: #f6f6fa;
    --text: #17152b;
    --muted: #615e78;
    --brand-1: #3f6dff;
    --brand-2: #8f52fa;
    --brand-3: #ff6b8c;
    --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background:
      radial-gradient(600px 420px at 8% 0%, rgba(63, 109, 255, 0.16), transparent 70%),
      radial-gradient(520px 420px at 100% 100%, rgba(255, 107, 140, 0.16), transparent 70%),
      var(--bg);
    color: var(--text);
    font-family: var(--display);
    -webkit-font-smoothing: antialiased;
  }
  .copy {
    position: absolute;
    left: 72px;
    top: 72px;
    width: 560px;
  }
  .brand { display: flex; align-items: center; gap: 16px; font-size: 30px; font-weight: 650; letter-spacing: -0.01em; }
  .brand img { width: 84px; height: 84px; filter: drop-shadow(0 10px 18px rgba(106, 60, 240, 0.25)); }
  h1 {
    margin: 52px 0 0;
    font-size: 54px;
    line-height: 1.04;
    letter-spacing: -0.03em;
    font-weight: 750;
  }
  .grad {
    background: linear-gradient(120deg, var(--brand-1), var(--brand-2) 55%, var(--brand-3));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .foot {
    position: absolute;
    left: 72px;
    bottom: 64px;
    font-size: 22px;
    color: var(--muted);
    letter-spacing: 0.005em;
  }
  .foot b { color: var(--text); font-weight: 600; }
  /* A real screenshot, running off the right edge like a window peeking in. */
  .shot {
    position: absolute;
    left: 640px;
    top: 92px;
    width: 760px;
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 2px 6px rgba(23, 21, 43, 0.12), 0 30px 70px rgba(40, 30, 110, 0.28);
    transform: rotate(-3deg);
    transform-origin: left top;
  }
  .shot img { display: block; width: 100%; }
</style>
</head>
<body>
  <div class="copy">
    <div class="brand"><img src="../../website/assets/icon.png" alt="">Relaunch</div>
    <h1>The paged app grid,<br><span class="grad">back on your Mac.</span></h1>
  </div>
  <div class="foot"><b>relaunch.stack42.tech</b> · Free &amp; open source · macOS 14+</div>
  <div class="shot"><img src="../../website/assets/screenshot-1.jpg" alt=""></div>
</body>
</html>
